# New-API Docker Compose Configuration
#
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Local data stays in ./data and ./logs. Coolify Git deploys should enable
# "Preserve Repository During Deployment", or remap these binds to named
# volumes under Persistent Storage.
#
# Coolify reads ${VAR} from this file (not .env.example). Unset SERVICE_*
# values fall back to the local defaults below (root / 123456 / new-api).
# Leave SESSION_COOKIE_SECURE=false and SESSION_COOKIE_TRUSTED_URL empty for
# local HTTP. For public HTTPS, set SECURE=true and an exact Origin in the UI.
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and the default SQL_DSN
#   2. Uncomment the mysql service and the MySQL SQL_DSN
#   3. Uncomment mysql in depends_on
#   4. Uncomment mysql_data in the volumes section
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SERVICE_URL_NEW_API_3000: /
      PORT: "3000"
      TZ: ${TZ:-Asia/Shanghai}
      SQL_DSN: ${SQL_DSN:-postgresql://${SERVICE_USER_POSTGRES:-root}:${SERVICE_PASSWORD_64_POSTGRES:-123456}@postgres:5432/${POSTGRES_DB:-new-api}}
      # SQL_DSN: root:123456@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      # LOG_SQL_DSN: postgresql://root:123456@postgres:5432/new-api-log # OPTIONAL: If you want a separate database for logging
      # LOG_SQL_DSN: clickhouse://default:123456@clickhouse:9000/new_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
      # LOG_SQL_CLICKHOUSE_TTL_DAYS: 0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      REDIS_CONN_STRING: ${REDIS_CONN_STRING:-redis://:${SERVICE_PASSWORD_REDIS:-123456}@redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-${SERVICE_REALBASE64_64_NEWAPI}}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DEBUG: ${DEBUG:-}
      GIN_MODE: ${GIN_MODE:-}
      ENABLE_PPROF: ${ENABLE_PPROF:-}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-new-api-node-1}
      # STREAMING_TIMEOUT: 300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
      # RELAY_IDLE_CONN_TIMEOUT: 90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
      # USER_SESSION_ACTIVE_LIMIT: 50
      # USER_SESSION_ISSUANCE_LIMIT: 100
      # USER_SESSION_ISSUANCE_WINDOW_SECONDS: 86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
      # USER_SESSION_REVOKED_RETENTION_DAYS: 7
      # USER_SESSION_HOURLY_ALERT_THRESHOLD: 5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
      # SYNC_FREQUENCY: 60  # Uncomment if regular database syncing is needed
      # GOOGLE_ANALYTICS_ID: G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
      # UMAMI_WEBSITE_ID: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
      # UMAMI_SCRIPT_URL: https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # mysql:
      #   condition: service_healthy
      # clickhouse:
      #   condition: service_started
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${SERVICE_PASSWORD_REDIS:-123456}"]
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-root}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-root} -d ${POSTGRES_DB:-new-api}"]
      interval: 5s
      timeout: 3s
      retries: 5
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

